# Configuration Jekyll pour le blog
# https://jekyllrb.com/docs/configuration/

# Informations du site
title: Cholet Legal Blog
description: >-
  Un blog simple pour partager des articles juridiques
baseurl: "/blog"
url: "https://choletlegal.github.io"

# Paramètres de build
markdown: kramdown
theme: null
permalink: /:year/:month/:day/:title.html

# Dossiers
source: .
destination: ./_site

# Exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .github/

# Paramètres par défaut pour les articles
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      author: Cholet Legal

# Ordre des articles (du plus récent au plus ancien)
posts_sort: "date:desc"
